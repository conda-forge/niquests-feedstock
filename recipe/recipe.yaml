schema_version: 1

context:
  name: niquests
  version: 3.21.2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/niquests-${{ version }}.tar.gz
  sha256: 586d6b9475c9018a42f19f1e4688077b8158101cbf40673c63d2c1a096cc7665

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.6.0,<2
    - pip
  run:
    - python >=${{ python_min }}
    - charset-normalizer >=2,<4
    - wassima >=1.0.1,<3
    - urllib3-future <3,>=2.13.903
    - urllib3.future >=2.13.903,<3
tests:
  - python:
      imports:
        - niquests
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Niquests is a simple, yet elegant, HTTP library. It is a drop-in replacement for Requests, which is under feature freeze.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/jawah/niquests

extra:
  recipe-maintainers:
    - rxm7706
    - jan-janssen
